[project]
name = "beacon"
version = "0.1.0"
description = "Beacon — a self-hosted, generic event ticketing platform (public site + backoffice + door scanning)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "basmulder03" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9",
    "qrcode[pil]>=7.4,<8.0",
    "weasyprint>=62.0,<63.0",
    # weasyprint 62.x's own metadata only declares `pydyf>=0.10.0` (no
    # upper bound), but its internal PDF-stream code (weasyprint/pdf/
    # stream.py) is only actually compatible with pydyf's pre-0.11 `Stream`
    # class shape — pydyf 0.11+ changed that class in a way that breaks
    # weasyprint 62.x at runtime (`AttributeError: 'super' object has no
    # attribute 'transform'` from ``HTML(...).write_pdf()`` — hit and
    # confirmed locally, see Milestone 4's PDF ticket generation work).
    # Pinned explicitly here so a fresh install doesn't silently resolve an
    # incompatible newer pydyf.
    "pydyf>=0.10,<0.11",
    "aiosmtplib>=3.0,<4.0",
    "argon2-cffi>=23.1,<24.0",
    "httpx>=0.27,<1.0",
    "itsdangerous>=2.2,<3.0",
    "cryptography>=42.0,<44.0",
    "tinycss2>=1.3,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
    # Headless-browser + axe-core automated accessibility checks against the
    # real rendered public site (see tests/accessibility/) — per
    # PROJECT_BRIEF.md's Testing section: "automated AA checks (e.g.
    # axe-core) run against public pages ... as part of the test suite, not
    # only as a manual pre-launch audit." Dev/test-only: never imported by
    # app code, not part of the production runtime image (see Dockerfile's
    # "NOTE for production" comment — this is the local-dev/test image).
    # The `chromium` browser binary itself is installed separately via
    # `playwright install --with-deps chromium` (see Dockerfile), not by
    # this pip dependency alone.
    "playwright>=1.45,<2.0",
]
loadtest = [
    # Manual, occasional pre-launch operational tooling (Milestone 9: "load-
    # test the sales-live moment") — deliberately its own optional-
    # dependency group, not part of `dev`, since it's not something every
    # contributor running pytest/mypy needs installed, and it never runs in
    # CI (see scripts/loadtest/README.md). Install with
    # `pip install -e ".[loadtest]"` only when you're actually about to run
    # a load test.
    "locust>=2.29,<3.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
# tinycss2 ships no py.typed marker / stubs (see app.core.css_sanitizer).
module = ["tinycss2", "tinycss2.ast"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# qrcode and weasyprint ship no py.typed marker / stubs (see
# app.services.ticket_pdf, Milestone 4).
module = ["qrcode", "weasyprint"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008 (function-call-in-default-argument) is a false positive for
# FastAPI's `Depends(...)`/`Query(...)` pattern, which is the documented,
# idiomatic way to declare dependencies — used throughout every route in
# this codebase, not just auth. Ignored project-wide rather than
# `# noqa`-ing every route parameter.
ignore = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
