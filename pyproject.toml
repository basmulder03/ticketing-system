[project]
name = "beacon"
version = "0.1.0"
description = "Beacon — a self-hosted, generic event ticketing platform (public site + backoffice + door scanning)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "basmulder03" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9",
    "qrcode[pil]>=7.4,<8.0",
    "weasyprint>=62.0,<63.0",
    "aiosmtplib>=3.0,<4.0",
    "argon2-cffi>=23.1,<24.0",
    "httpx>=0.27,<1.0",
    "itsdangerous>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
