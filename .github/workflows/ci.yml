name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # SMTP sink for the EventConfig connection-test integration test
      # (tests/integration/test_event_configs_routes.py) — a real send
      # against Mailpit, not a mock, same as local dev's docker-compose
      # stack. This job runs directly on the runner (not in a container),
      # so the service is reachable at localhost via the mapped port below,
      # not by its service name — see SEED_SMTP_HOST override.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
    env:
      DATABASE_URL: postgresql+asyncpg://beacon:beacon@localhost:5432/beacon
      SECRET_KEY: ci-secret-key
      ENCRYPTION_KEY: ci-encryption-key-not-for-real-use
      # Matches the Mailpit service above — overrides the "mailpit" hostname
      # default (which only resolves inside docker-compose's local dev
      # network, see app/core/config.py's seed_smtp_host).
      SEED_SMTP_HOST: localhost
      SEED_SMTP_PORT: 1025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies (weasyprint runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi8 shared-mime-info fonts-dejavu-core

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy app tests
