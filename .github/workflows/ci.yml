name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beacon -d beacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # SMTP sink for the EventConfig connection-test integration test
      # (tests/integration/test_event_configs_routes.py) and Milestone 4's
      # real send-path tests (tests/integration/test_ticket_delivery.py) —
      # a real send against Mailpit, not a mock, same as local dev's
      # docker-compose stack. This job runs directly on the runner (not in
      # a container), so the service is reachable at localhost via the
      # mapped ports below, not by its service name — see SEED_SMTP_HOST
      # override. Port 8025 (Mailpit's HTTP API, not just its web UI) is
      # also mapped so tests can poll for and inspect real delivered
      # message content (see tests/integration/conftest.py's
      # fetch_latest_mailpit_message_to).
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql+asyncpg://beacon:beacon@localhost:5432/beacon
      SECRET_KEY: ci-secret-key
      ENCRYPTION_KEY: ci-encryption-key-not-for-real-use
      # Matches the Mailpit service above — overrides the "mailpit" hostname
      # default (which only resolves inside docker-compose's local dev
      # network, see app/core/config.py's seed_smtp_host).
      SEED_SMTP_HOST: localhost
      SEED_SMTP_PORT: 1025
      # Settings.uploads_dir defaults to "/app/uploads" (correct inside the
      # docker-compose app container, see docker-compose.yml's volume mount)
      # — this job runs directly on the runner, not in a container, where
      # "/app" doesn't exist and isn't creatable (root-owned). Overridden to
      # a runner-writable path under the checkout.
      UPLOADS_DIR: ${{ github.workspace }}/uploads
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies (weasyprint runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi8 shared-mime-info fonts-dejavu-core

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Install Playwright Chromium (accessibility test suite)
        # tests/integration/test_public_site_accessibility.py drives a real
        # headless Chromium page (axe-core) against the public site — see
        # tests/integration/conftest.py's axe_page fixture. `--with-deps`
        # also installs the OS-level libraries Chromium needs on this
        # runner image. devops-agent: flagged for review re: caching this
        # across CI runs (the download is ~300MB and doesn't change often)
        # rather than re-fetching on every job.
        run: playwright install --with-deps chromium

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy app tests

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check app tests
